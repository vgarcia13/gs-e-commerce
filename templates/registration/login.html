{% extends "base.html" %}

{% block title %}Log in{% endblock %}

{% block content %}
<section class="auth-card">
    <h1>Log in</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Log in</button>
    </form>
    <p>No account? <a href="{% url 'accounts:signup' %}">Sign up</a>.</p>
</section>
{% endblock %}
