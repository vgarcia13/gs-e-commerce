{% extends "base.html" %}

{% block title %}Form expired{% endblock %}

{% block content %}
<section class="error-page">
    <h1>Form expired</h1>
    <p>This form is no longer valid, usually because it was open for too long or cookies are blocked. Open the page again and resubmit.</p>
    <p><a href="{% url 'catalog:product_list' %}">Back to products</a></p>
</section>
{% endblock %}
