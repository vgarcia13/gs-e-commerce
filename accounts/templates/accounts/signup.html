{% extends "base.html" %}

{% block title %}Sign up{% endblock %}

{% block content %}
<section class="auth-card">
    <h1>Create an account</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Sign up</button>
    </form>
    <p>Already registered? <a href="{% url 'accounts:login' %}">Log in</a>.</p>
</section>
{% endblock %}
