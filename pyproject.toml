[project]
name = "gs-ecommerce"
version = "0.1.0"
description = "E-commerce application with product management, CSV import, search and checkout"
requires-python = ">=3.10,<3.14"
dependencies = [
    "Django>=5.2.17,<6.0",
    "psycopg[binary]>=3.3.5,<4.0",
    "gunicorn>=26.2.0,<27.0",
    "whitenoise>=6.12.0,<7.0",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=9.1.1,<10.0"
pytest-django = ">=4.14.0,<5.0"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "-q"
